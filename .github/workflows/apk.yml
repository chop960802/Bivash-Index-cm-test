name: APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Index app
        uses: actions/checkout@v4

      - name: Unzip Google AI Studio project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE" -d src
            cd src
            if [ $(ls -1 | wc -l) -eq 1 ] && [ -d "$(ls -1)" ]; then
              ROOT_DIR=$(ls -1)
              mv "$ROOT_DIR"/* . 2>/dev/null || true
              mv "$ROOT_DIR"/.[!.]* . 2>/dev/null || true
              rmdir "$ROOT_DIR" 2>/dev/null || true
            fi
          else
            mkdir -p src
            shopt -s extglob
            cp -r !(src|.git|.github) src/ 2>/dev/null || true
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build Web App & Convert to Android
        working-directory: ./src
        run: |
          # Build React/Vite app if package.json exists, otherwise treat as static HTML
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps
            npm run build
          else
            mkdir -p dist
            cp -r * dist/ 2>/dev/null || true
          fi

          # Detect web output folder (dist or build)
          WEB_DIR="dist"
          if [ -d "build" ] && [ ! -d "dist" ]; then
            WEB_DIR="build"
          fi

          # Initialize Capacitor and wrap as Android project
          npm init -y 2>/dev/null || true
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Index App" "com.indexapp.android" --web-dir="$WEB_DIR"
          npx cap add android
          npx cap sync android

      - name: Compile Android APK
        working-directory: ./src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Index-app-debug
          path: src/android/app/build/outputs/apk/debug/*.apk
          
